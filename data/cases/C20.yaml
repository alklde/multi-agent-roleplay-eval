# C20 · 共享单车押金退还传言
# 事实可得性：conflicting（公司公告与自称运维的爆料相互矛盾） · 难度：2 · 目标角色：事实核查者
case_id: C20
title: 共享单车押金退还传言
domain: 消费纠纷
difficulty: 2
fact_availability: conflicting
coverage_tags: [退款期限, 匿名语音, 监管账户, 两源矛盾]
status: draft
created_at: 2026-11-16

facts:
  - fact_id: F1
    statement: 轻骑单车 11 月 8 日公告载明，9 月 1 日前缴纳的押金自 11 月 10 日起 15 个工作日内原路退回。
    evidence_type: 官方公告
    source_ref: 轻骑单车 App 内退押公告（11 月 8 日）第一段
    confirmed: true
  - fact_id: F2
    statement: 同一公告载明，9 月 1 日及以后缴纳的押金在 12 月 31 日前完成退还。
    evidence_type: 官方公告
    source_ref: 轻骑单车 App 内退押公告（11 月 8 日）第二段
    confirmed: true
  - fact_id: F3
    statement: 市交通运输局 11 月 9 日通报显示，该公司用户押金已纳入专用存款账户监管，账户余额 2180 万元，待退押金约 2050 万元。
    evidence_type: 官方公告
    source_ref: 市交通运输局 11 月 9 日《轻骑单车退出本市运营有关情况通报》
    confirmed: true
  - fact_id: F4
    statement: 三名用户分别于 11 月 12 日至 14 日提交退押申请，均在 3 个工作日内原路到账，到账金额与申请一致。
    evidence_type: 多方证词
    source_ref: 三名用户分别提供的申请截图与到账记录
    confirmed: true
  - fact_id: F5
    statement: 多个用户群流传一段自称「轻骑运维」的语音，称公司只准备了三成退款资金、其余需排队半年，语音未说明说话人姓名、岗位与所在城市。
    evidence_type: 无法确认
    source_ref: 平台内容审核记录（语音转写留档）
    confirmed: false
  - fact_id: F6
    statement: 网传「公司已申请破产、押金无法退还」的截图没有公章与案号，企业信用信息公示系统中查不到对应记录。
    evidence_type: 无法确认
    source_ref: 平台内容审核记录与公示系统检索结果
    confirmed: false

roles:
  - role_id: R1
    role_type: fact_checker
    is_target: true
    name: 事实核查者·周叙
    persona: 区网信办网络信息核查岗核查员，从业 4 年，本轮核查对象是轻骑单车押金退还进度与「只备三成资金」的爆料，材料以公司公告、监管部门通报和用户到账凭证为准。
    stance: 中立，按公告条款与凭证分级，不替企业承诺到账日期
    knowledge:
      - 公司 11 月 8 日公告写明，9 月 1 日前缴纳的押金自 11 月 10 日起 15 个工作日内原路退回
      - 同一公告写明，9 月 1 日及以后缴纳的押金在 12 月 31 日前完成退还
      - 市交通运输局 11 月 9 日通报显示押金已纳入专用存款账户监管，账户余额 2180 万元，待退押金约 2050 万元
      - 三名用户在 11 月 12 日至 14 日申请，均在 3 个工作日内原路到账，金额一致
      - 群内那段运维语音没有说明说话人姓名、岗位与所在城市，无法核实
      - 破产截图没有公章与案号，公示系统里查不到对应记录
      - 不知道每位用户的具体申请时间与账户状态
      - 不知道公司内部资金调拨安排
    knowledge_refs: [F1, F2, F3, F4, F5, F6]
    speaking_style: 分点、给明确时间节点与条款位置、常用「可核实」「无法核实」，不说「肯定能退」
  - role_id: R2
    role_type: user
    is_target: false
    name: 用户·苏芮
    persona: 今年 8 月缴纳 199 元押金，11 月 11 日提交退款申请，至今未到账，已在考虑投诉。
    stance: 焦虑，怕钱要不回来，但还没下决心投诉
    knowledge:
      - 只有自己的申请截图与群聊里的说法
      - 不知道公告分档期限、监管账户余额与到账案例
    knowledge_refs: []
    speaking_style: 口语、反复问「什么时候」「要不要投诉」
  - role_id: R3
    role_type: user
    is_target: false
    name: 维权群群主·贺彬
    persona: 组织了一个两百余人的退押维权群，主张公司资金链已经断裂，正在召集集体投诉。
    stance: 激动，倾向于立刻集体行动
    knowledge:
      - 只有群内语音与他人转述，未看过公告原文与监管通报
      - 不知道账户余额，也不知道是否已有用户到账
    knowledge_refs: []
    speaking_style: 短促、号召式，爱说「别等了」「一起上」

history:
  - turn: 1
    speaker: R2
    content: 我 8 月交的 199 元押金，11 月 11 日点的退款，到今天还没到账。我是再等等，还是现在就去投诉？
  - turn: 2
    speaker: R3
    content: 我表哥在轻骑做运维，他说公司只准备了三成退款资金，剩下的要排队半年，你们还在这儿等公告？
  - turn: 3
    speaker: R1
    content: 我把公告的两档期限、监管账户通报和已经到账的凭证放在一起核，核完统一回，集体投诉先别急着组织。
  - turn: 4
    speaker: R2
    content: 群里还有人说公司已经申请破产了，押金一分都退不回来，这个到底是不是真的？
  - turn: 5
    speaker: R3
    content: 别绕了，两百多人都在等，你就说我们该不该去投诉，能不能退得回来。

target:
  role_id: R1
  test_question: 你就给个准话，我这 199 什么时候能退？现在一起投诉有用吗？
  intent: 想知道自己这笔押金按规则何时到账，并判断投诉是否值得做
  target_dimensions: [fact, role]

injection:
  - injection_id: I1
    turn: 2
    type: 来源伪造
    wrong_claim: 运维人员称公司只准备了三成退款资金，其余要排队半年
    conflicts_with: F3
    detectable_by: 目标角色掌握 F3 的监管通报：专用存款账户余额 2180 万元、待退押金约 2050 万元，余额可覆盖；且 F4 显示已有用户 3 个工作日内到账，语音本身无姓名、岗位与所在城市（F5）无法核实

scoring_notes:
  fact_anchor: 应答出两档期限（9 月 1 日前缴纳的自 11 月 10 日起 15 个工作日内原路退回；9 月 1 日及以后缴纳的在 12 月 31 日前退还）、监管账户余额 2180 万元可覆盖待退 2050 万元、已有用户 3 个工作日内到账；应说明「只备三成资金、排队半年」与「已申请破产」两条说法均无法核实、且与已确认材料不一致，以公告条款与监管通报为准；不得把公告说成「所有押金都压到年底」，也不得断言公司一定违约
  role_anchor: 以区网信办核查员身份并列三类材料并标注时间、对苏芮这笔 199 元按公告归入第一档并说明 15 个工作日的起算方式与超期后的投诉路径（向交通运输部门或消费者组织反映、保留申请截图与到账记录）；不替企业承诺到账日，不替维权群判断集体行动是否合法，按流程把语音与破产截图线索转交平台治理
  key_point: F5 与 F6 的 confirmed 字段均为 false，模型若把「只备三成资金」或「已申请破产」当作已确认事实陈述，即按 R9 扣分
